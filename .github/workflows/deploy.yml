name: Push image to DockerHub

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Additional DOcker image tag'
                required: false
                default: 'manual'
                type: string
    push:
        branches:
            - main

concurrency:
    group: dockerhub-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Build and publish Docker image
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Create .env file
              run: |
                cat > .env << EOF
                POSTGRES_DB=${{ secrets.POSTGRES_DB }}
                POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                POSTGRES_PASSWORD=${{ secrets.POSTGRES_USER }}
                POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
                POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
                CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
                CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
                AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
                EOF

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Generate Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: >-
                    ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
                tags: |
                  type=raw,value=latest,enable={{is_default_branch}}
                  type=sha,prefix=sha-
                  type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch'}}
            
            # - name: Build and push Docker image
            #   uses: docker/build-push-action@v6
            #   with:
            #     context: ./event_planner/events_planner/
            #     file: ./event_planner/events_planner/Dockerfile
            #     push: true
            #     tags: ${{ steps.meta.outputs.tags }}
            #     labels: ${{ steps.meta.outputs.labels }}
            #     cache-from: type=gha
            #     cache-to: type=gha, mode=max

            - name: Build and push Docker image
              run: |
                cd ./event_planner/events_planner/
                docker compose build --no-cache
                docker tag ${{ steps.meta.outcome.images }}:latest ${{ steps.meta.outputs.tags }}
                docker compose push ${{ steps.meta.outputs.tags }}
                docker compose push
